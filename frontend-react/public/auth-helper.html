<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ascend Demo Auth</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f4ede0 0%, #fbf7ef 100%);
        color: #203126;
      }
      main {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(34, 51, 42, 0.12);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      code {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Preparing Ascend demo session…</h1>
      <p id="status">Signing in and loading the selected portal.</p>
    </main>
    <script src="/runtime-config.js"></script>
    <script>
      const API_URL = window.ASCEND_RUNTIME_CONFIG?.apiUrl ?? window.ASCEND_API_URL ?? "http://127.0.0.1:8000";
      const AUTH_TOKEN_KEY = "ascend_member_token";
      const AUTH_MEMBER_KEY = "ascend_member_info";

      const ROLE_CONFIG = {
        member: { loginPath: "/api/auth/login", memberKey: "member" },
        builder: { loginPath: "/api/builder/auth/login", memberKey: "builder" },
        leader: { loginPath: "/api/staff/auth/login", memberKey: "user" },
        attorney: { loginPath: "/api/staff/auth/login", memberKey: "user" },
        admin: { loginPath: "/api/staff/auth/login", memberKey: "user" },
      };

      async function run() {
        const params = new URLSearchParams(window.location.search);
        const role = params.get("role") || "member";
        const username = params.get("username") || "";
        const password = params.get("password") || "";
        const status = document.getElementById("status");
        const config = ROLE_CONFIG[role];

        if (!config || !username || !password) {
          status.textContent = "Missing role, username, or password for demo sign-in.";
          return;
        }

        try {
          const formData = new FormData();
          formData.set("username", username);
          formData.set("password", password);
          const response = await fetch(`${API_URL}${config.loginPath}`, {
            method: "POST",
            body: formData,
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Login failed.");
          }

          localStorage.setItem(AUTH_TOKEN_KEY, payload.token || "");
          localStorage.setItem(AUTH_MEMBER_KEY, JSON.stringify(payload[config.memberKey] || {}));
          status.textContent = "Session ready. Opening portal…";
          window.location.replace("/");
        } catch (error) {
          status.innerHTML = `Could not prepare the demo session.<br /><code>${String(error.message || error)}</code>`;
        }
      }

      run();
    </script>
  </body>
</html>
