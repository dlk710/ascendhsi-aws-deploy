<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ascend Demo Logout</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf7ef;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #203126;
      }
    </style>
  </head>
  <body>
    <script>
      localStorage.removeItem("ascend_member_token");
      localStorage.removeItem("ascend_member_info");
      window.location.replace("/");
    </script>
  </body>
</html>
