name: Deploy backend to AWS dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "requirements.txt"
      - "deploy/aws/backend.Dockerfile"
      - ".github/workflows/deploy-backend-dev.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-dev-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "027903151318"
  ECR_REPOSITORY: ascend-dev-backend
  ECS_CLUSTER: ascend-dev-cluster
  ECS_SERVICE: ascend-dev-backend
  TARGET_DEV_URL: https://dev-portal.ascendhsi.com
  SMOKE_URL: https://dq5ab404dg57q.cloudfront.net/ready

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::027903151318:role/ascend-dev-deployer
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE_URI="${ECR_URI}:${SHA}"
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/aws/backend.Dockerfile \
            -t "${IMAGE_URI}" \
            -t "${ECR_URI}:dev-latest" \
            --push .
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Register ECS task definition
        run: |
          set -euo pipefail
          CURRENT_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].taskDefinition' \
            --output text)"
          aws ecs describe-task-definition \
            --task-definition "${CURRENT_TASK_DEFINITION}" \
            --query 'taskDefinition' > task-definition.json
          jq --arg image "${IMAGE_URI}" '
            .containerDefinitions[0].image = $image
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-definition.json > task-definition-next.json
          NEXT_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "NEXT_TASK_DEFINITION=${NEXT_TASK_DEFINITION}" >> "${GITHUB_ENV}"

      - name: Deploy ECS service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEXT_TASK_DEFINITION}"
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Diagnose ECS deployment failure
        if: failure()
        run: |
          set +euo pipefail
          echo "Recent ECS service events"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].events[0:10].[createdAt,message]' \
            --output table
          echo "Current service deployments"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].deployments[*].{status:status,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks,rollout:rolloutState,reason:rolloutStateReason}' \
            --output table
          echo "Recent tasks"
          TASK_ARNS="$(aws ecs list-tasks --cluster "${ECS_CLUSTER}" --service-name "${ECS_SERVICE}" --desired-status STOPPED --query 'taskArns[0:5]' --output text)"
          if [ -n "${TASK_ARNS}" ] && [ "${TASK_ARNS}" != "None" ]; then
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks ${TASK_ARNS} \
              --query 'tasks[*].{taskArn:taskArn,lastStatus:lastStatus,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS "${SMOKE_URL}"; then
              echo "Backend ready"
              exit 0
            fi
            sleep 10
          done
          exit 1
