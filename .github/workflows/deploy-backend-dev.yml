name: Deploy backend to AWS dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "requirements.txt"
      - "deploy/aws/backend.Dockerfile"
      - ".github/workflows/deploy-backend-dev.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "027903151318"
  ECR_REPOSITORY: ascend-dev-backend
  ECS_CLUSTER: ascend-dev-cluster
  ECS_SERVICE: ascend-dev-backend
  SMOKE_URL: https://dq5ab404dg57q.cloudfront.net/ready

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::027903151318:role/ascend-dev-deployer
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/aws/backend.Dockerfile \
            -t "${ECR_URI}:${SHA}" \
            -t "${ECR_URI}:dev-latest" \
            --push .

      - name: Force ECS deployment
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS "${SMOKE_URL}"; then
              echo "Backend ready"
              exit 0
            fi
            sleep 10
          done
          exit 1
